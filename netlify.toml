[functions]
  directory = "netlify/functions"

# Yara Stage 4 render worker: ffmpeg-static's linux binary must ship inside
# the function bundle (installed with npm_config_platform=linux).
[functions."tighten-video-background"]
  node_bundler = "esbuild"
  included_files = ["node_modules/ffmpeg-static/ffmpeg"]

[functions."scheduled-spark-reminder"]
  schedule = "*/5 * * * *"

[functions."scheduled-event-reminder"]
  schedule = "*/5 * * * *"


