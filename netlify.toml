[[edge_functions]]
  function = "profile-og"
  path = "/p/*"

[[edge_functions]]
  function = "event-og"
  path = "/events/*"

[[edge_functions]]
  function = "replay-og"
  path = "/replay/*"

[[edge_functions]]
  function = "role-og"
  path = "/roles/*"

[[edge_functions]]
  function = "radar-og"
  path = "/radar/*"

[functions]
  directory = "netlify/functions"

[functions."scheduled-spark-reminder"]
  schedule = "*/5 * * * *"

[functions."scheduled-event-reminder"]
  schedule = "*/5 * * * *"


[[redirects]]
  from = "/invite/*"
  to = "https://app.facemeet.app/?ref=:splat"
  status = 302

[[redirects]]
  from = "/invite"
  to = "https://app.facemeet.app/"
  status = 302

