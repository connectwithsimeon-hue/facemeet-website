<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FaceMeet Live Conversation</title>
<meta name="description" content="A scheduled live conversation on FaceMeet.">
<meta property="og:title" content="FaceMeet Live Conversation">
<meta property="og:description" content="A scheduled live conversation on FaceMeet, the trusted network for real conversations.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://facemeet.app/assets/brand/facemeet-replay-card.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0a0807;--coral:#e8503a;--coral-light:#ff6f56;--cream:#f5f0e8;--cream-dim:rgba(245,240,232,0.68);--muted:#8a7e72;--border2:rgba(245,240,232,0.14);--surface:rgba(245,240,232,0.05)}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:var(--bg)}
body{min-height:100vh;background:radial-gradient(circle at 12% 16%,rgba(232,80,58,.18),transparent 31%),linear-gradient(180deg,#0a0807,#080706);color:var(--cream);font-family:'Outfit',sans-serif;font-weight:300;line-height:1.6}
.shell{width:min(760px,100%);margin:0 auto;padding:34px 20px 60px}
.eyebrow{display:inline-flex;color:var(--coral-light);background:rgba(232,80,58,.11);border:1px solid rgba(232,80,58,.28);border-radius:999px;padding:8px 13px;font-size:11px;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:22px}
h1{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,6vw,58px);line-height:1.04;margin-bottom:18px}
.meta{color:var(--cream-dim);font-size:16px;margin-bottom:8px}
.hosts{color:var(--cream);font-weight:600;margin-bottom:22px}
.desc{color:var(--cream-dim);font-size:16px;line-height:1.75;margin:18px 0 26px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;border-radius:999px;padding:14px 26px;text-decoration:none;font-weight:700;font-size:14px;cursor:pointer;border:1px solid transparent;font-family:'Outfit',sans-serif;margin-right:10px;margin-bottom:10px}
.cta.primary{background:linear-gradient(135deg,var(--coral),var(--coral-light));color:#fff}
.cta.ghost{background:var(--surface);color:var(--cream);border-color:var(--border2)}
.hidden{display:none!important}
.note{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="shell">
  <div class="eyebrow">Scheduled Live Conversation</div>
  <div id="state-loading"><h1>Loading <em>conversation.</em></h1></div>
  <main id="state-event" class="hidden">
    <h1 id="ev-title"></h1>
    <div class="meta" id="ev-when"></div>
    <div class="hosts" id="ev-hosts"></div>
    <div class="meta" id="ev-interested"></div>
    <p class="desc" id="ev-desc"></p>
    <a class="cta primary" id="ev-cta" href="https://app.facemeet.app">Open in FaceMeet</a>
    <button class="cta ghost" id="ev-cal" type="button">Add to Calendar (.ics)</button>
    <p class="note">Live conversations happen inside FaceMeet — the trusted network for real conversations.</p>
  </main>
  <div id="state-missing" class="hidden"><h1>This conversation is <em>unavailable.</em></h1></div>
</div>
<script>
const SUPABASE_URL='https://vbaiivsvjdntzaffboue.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZiYWlpdnN2amRudHphZmZib3VlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzYxODk2NjQsImV4cCI6MjA5MTc2NTY2NH0.ZNzIdnuQXf69nLmo7FafLASNOG6_2m36JZQKCIQzK-w';
const GOOGLE_PLAY_URL='https://play.google.com/store/apps/details?id=com.ononobi.facemeet';
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false}});
let eventData=null;

function slugFromPath(){
  const parts=window.location.pathname.split('/').filter(Boolean);
  const i=parts.indexOf('events');
  return i>=0&&parts[i+1]?decodeURIComponent(parts[i+1]):'';
}
function show(id){['state-loading','state-event','state-missing'].forEach(s=>document.getElementById(s).classList.toggle('hidden',s!==id));}
function icsDate(iso){return new Date(iso).toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';}

function downloadIcs(){
  if(!eventData)return;
  const url='https://facemeet.app/events/'+encodeURIComponent(slugFromPath());
  const hosts=[eventData.host&&eventData.host.name].concat((eventData.cohosts||[]).map(c=>c.name)).filter(Boolean).join(', ');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//FaceMeet//EN','BEGIN:VEVENT',
    'UID:'+eventData.id+'@facemeet.app',
    'DTSTAMP:'+icsDate(new Date().toISOString()),
    'DTSTART:'+icsDate(eventData.starts_at),
    'DTEND:'+icsDate(eventData.ends_at||eventData.starts_at),
    'SUMMARY:'+String(eventData.title||'FaceMeet Conversation').replace(/[\n,;]/g,' '),
    'DESCRIPTION:'+String((eventData.description||'')+' Hosted by '+hosts+' — '+url).replace(/\n/g,'\\n').replace(/[,;]/g,' '),
    'URL:'+url,
    'BEGIN:VALARM','TRIGGER:-PT10M','ACTION:DISPLAY','DESCRIPTION:FaceMeet conversation starts in 10 minutes','END:VALARM',
    'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const blob=new Blob([ics],{type:'text/calendar'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='facemeet-conversation.ics';
  a.click();
}

async function load(){
  const slug=slugFromPath();
  const params=new URLSearchParams(window.location.search);
  if(!slug){show('state-missing');return;}
  try{
    const {data,error}=await client.rpc('get_scheduled_conversation',{p_slug:slug,p_ref:params.get('ref')});
    if(error||!data){show('state-missing');return;}
    eventData=data;
    document.title=data.title+' | FaceMeet';
    document.getElementById('ev-title').textContent=data.title;
    const start=new Date(data.starts_at);
    document.getElementById('ev-when').textContent=start.toLocaleString(undefined,{weekday:'long',month:'long',day:'numeric',hour:'numeric',minute:'2-digit'});
    const hosts=[data.host&&data.host.name].concat((data.cohosts||[]).map(c=>c.name)).filter(Boolean);
    document.getElementById('ev-hosts').textContent='Hosted by '+hosts.join(' & ');
    document.getElementById('ev-interested').textContent=(data.interested_count||0)+' interested';
    document.getElementById('ev-desc').textContent=data.description||'';
    const cta=document.getElementById('ev-cta');
    const isAndroid=/android/i.test(navigator.userAgent);
    const appUrl=isAndroid?GOOGLE_PLAY_URL:'https://app.facemeet.app/events/'+encodeURIComponent(slug)+(params.get('ref')?'?ref='+encodeURIComponent(params.get('ref')):'');
    cta.href=appUrl;
    if(data.live_topic_status==='live'){cta.textContent='Join Live in FaceMeet';}
    else if(data.replay_slug){cta.textContent='Watch the Replay';cta.href='https://facemeet.app/replay/'+encodeURIComponent(data.replay_slug);}
    else{cta.textContent='Get Notified in FaceMeet';}
    document.getElementById('ev-cal').addEventListener('click',downloadIcs);
    show('state-event');
    if(params.get('ics')==='1'){downloadIcs();}
  }catch(e){console.warn('event load failed',e);show('state-missing');}
}
load();
</script>
</body>
</html>
